name: Pocket Studio live bridge CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/build_pages.py'
      - 'scripts/test_pocket_studio_texture_export.mjs'
      - 'scripts/patch_pocket_studio_live_bridge.py'
      - 'scripts/patch_pocket_studio_material_pack.py'
      - 'scripts/patch_v1_8_10_5_blue_explorer.py'
      - 'scripts/patch_v1_8_10_6_solver_runtime.py'
      - 'assets/characters/**'
      - '.github/workflows/pocket-studio-bridge-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install texture generator dependencies
        run: python -m pip install --disable-pip-version-check numpy pillow
      - name: Generate and verify 2K textures
        run: |
          python scripts/generate_textures.py --output assets/textures --resolution 2048
          python scripts/verify_textures.py assets/textures 2048
      - name: Build Studio with Pocket bridge, Blue Explorer and shared solver runtime
        run: python scripts/build_pages.py
      - name: Execute built texture exporter regression
        run: node scripts/test_pocket_studio_texture_export.mjs
      - name: Verify bridge, Blue Explorer and shared solver runtime contract
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, json, hashlib
          h=Path('_site/index.html').read_text(encoding='utf-8')
          solver=Path('_site/assets/runtime/studio-solver-runtime-v1.mjs')
          if not solver.is_file():
            raise SystemExit('shared solver runtime module missing')
          solver_sha=hashlib.sha256(solver.read_bytes()).hexdigest()
          solver_match=re.search(r'POCKET_STUDIO_SOLVER_RUNTIME_SHA256="([0-9a-f]{64})"',h)
          if not solver_match or solver_match.group(1)!=solver_sha:
            raise SystemExit('shared solver runtime SHA mismatch')
          required=[
            'Character Prototype Studio V1.8.10.6',
            'BLUE_EXPLORER_PRIMARY_ID="blue-explorer-primary-v1"',
            'function buildCharacter(preserve=true){return buildBlueExplorerPrimaryCharacter(preserve)}',
            'model.root.userData.engineRole="primary-character"',
            'throwStyle:"overhand-baseball"',
            'POCKET_STUDIO_CHARACTER_REQUEST',
            'POCKET_STUDIO_CHARACTER_PACKAGE',
            'window.POCKET_STUDIO_CHARACTER_BRIDGE',
            'pocket-character-runtime-v1',
            'three-group-scenegraph-v1',
            'provider:"studio-character"',
            'gameplayPolicy:{included:false',
            'pocket-character-motion-pack-v1',
            'pocketStudioReadyMotionPack',
            'requiredActions=["idle","walk","run","jump","attack","hurt","dead","capture_throw","summon_monster_throw","monster_command"]',
            'capture_throw:"capture_throw_r"',
            'events:[{type:"release"',
            'pocket-character-render-profile-v1',
            'POCKET_STUDIO_TEXTURE_INTEGRITY=',
            'studio-solver-runtime-v1',
            'same-standalone-runtime-source',
            'solverRuntime:pocketStudioSolverRuntimeContract()',
            'assets/runtime/studio-solver-runtime-v1.mjs',
          ]
          for token in required:
            if token not in h:
              raise SystemExit('missing bridge/solver regression token: '+token)
          if '"attack-ranged":"capture_throw_r"' in h or 'skill:"capture_throw_r"' in h:
            raise SystemExit('Capture Throw must not masquerade as ranged attack or generic skill')
          match=re.search(r'const POCKET_STUDIO_TEXTURE_INTEGRITY=(\{.*?\});',h)
          if not match:
            raise SystemExit('Studio texture integrity map missing')
          integrity=json.loads(match.group(1))
          if len(integrity)<20 or not all(re.fullmatch(r'[0-9a-f]{64}',value) for value in integrity.values()):
            raise SystemExit('Studio texture integrity map is incomplete or invalid')
          scripts=re.findall(r'<script type="module">(.*?)</script>',h,re.S)
          if not scripts:
            raise SystemExit('module script not found')
          Path('/tmp/studio-pocket-bridge.mjs').write_text(scripts[-1],encoding='utf-8')
          print('Pocket Studio V1.8.10.6 shared solver contract gate passed',solver_sha)
          PY
          node --check /tmp/studio-pocket-bridge.mjs
          node --check _site/assets/runtime/studio-solver-runtime-v1.mjs
