name: Deploy Character Studio V1.8.9 to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install texture generator dependencies
        run: python -m pip install --disable-pip-version-check numpy pillow

      - name: Generate native 2K PBR starter textures
        run: python scripts/generate_textures.py --output assets/textures --resolution 2048

      - name: Verify texture quality gate
        run: python scripts/verify_textures.py assets/textures 2048

      - name: Build V1.8.9 Pages artifact
        run: python scripts/build_pages.py

      - name: Verify V1.8.9 core action/reaction and regression gates
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          h=Path('_site/index.html').read_text(encoding='utf-8')
          ids=re.findall(r'id="([^"]+)"',h)
          if len(ids)!=len(set(ids)):
              raise SystemExit('duplicate DOM ids in V1.8.9')
          if h.count('id="btnTemplateAttack"')!=1 or h.count('id="btnTemplateWalk"')!=1:
              raise SystemExit('animation library controls missing/duplicated')
          if h.index('ANIMATION LIBRARY') > h.index('TIMELINE'):
              raise SystemExit('animation library moved below Timeline')
          preserved=[
              'Twist_Isolation_V1_8_5_2',
              'walkVisualShiftCap:.016',
              'run:{cadence:1.48',
              'sprint:{cadence:1.88',
              'FOOT PLANT + LEG RESPONSE',
              'maxRootCorrection:.028',
              'Jump_Core',
              'Crouch_Walk_Core',
              'Weapon ยังไม่เริ่ม'
          ]
          for token in preserved:
              if token not in h:
                  raise SystemExit('missing preserved regression token: '+token)
          required=[
              'id="btnTemplateDodgeR"',
              'id="btnTemplateDodgeL"',
              'id="btnTemplateHitReact"',
              'id="btnTemplateKnockback"',
              'id="btnTemplateGetUp"',
              'id="btnTemplateDeath"',
              'id="btnTemplateFaint"',
              'id="btnTemplateInteract"',
              'createDodgeCoreTemplate(side="R")',
              '$("#btnTemplateDodgeR").onclick=()=>createDodgeCoreTemplate("R")',
              '$("#btnTemplateDodgeL").onclick=()=>createDodgeCoreTemplate("L")',
              'Hit_React_Core',
              'Knockback_Core',
              'Get_Up_Core',
              'Death_Core',
              'Faint_Core',
              'Interact_Core',
              'actionType:"dodge"',
              'clip.runtime.motionClass="custom";clip.runtime.state=state',
              'clip.locomotionDynamics.enabled=false;clip.bodyDynamics.enabled=false;clip.attackProfile.enabled=false',
              'core-action-reaction-pack',
              'interact.commit',
              'impactMarkers=[{id:animationId(),time:.10,type:"hit",strength:.72',
              'impactMarkers=[{id:animationId(),time:.10,type:"hit",strength:1.08'
          ]
          for token in required:
              if token not in h:
                  raise SystemExit('missing V1.8.9 action/reaction gate: '+token)
          scripts=re.findall(r'<script type="module">(.*?)</script>',h,re.S)
          if not scripts:
              raise SystemExit('module script not found')
          Path('/tmp/studio-v189.mjs').write_text(scripts[-1],encoding='utf-8')
          print('V1.8.9 core action/reaction regression gates passed')
          PY
          node --check /tmp/studio-v189.mjs

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
