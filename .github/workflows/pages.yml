name: Deploy Character Studio V1.8.10 to Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install texture generator dependencies
        run: python -m pip install --disable-pip-version-check numpy pillow

      - name: Generate native 2K PBR starter textures
        run: python scripts/generate_textures.py --output assets/textures --resolution 2048

      - name: Verify texture quality gate
        run: python scripts/verify_textures.py assets/textures 2048

      - name: Build V1.8.10 Pages artifact
        run: python scripts/build_pages.py

      - name: Verify V1.8.10 core animation QA transitions and regression gates
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          h=Path('_site/index.html').read_text(encoding='utf-8')
          ids=re.findall(r'id="([^"]+)"',h)
          if len(ids)!=len(set(ids)):
              raise SystemExit('duplicate DOM ids in V1.8.10')
          if h.count('id="btnTemplateAttack"')!=1 or h.count('id="btnTemplateWalk"')!=1:
              raise SystemExit('animation library controls missing/duplicated')
          if h.index('ANIMATION LIBRARY') > h.index('TIMELINE'):
              raise SystemExit('animation library moved below Timeline')
          preserved=[
              'Twist_Isolation_V1_8_5_2',
              'walkVisualShiftCap:.016',
              'run:{cadence:1.48',
              'sprint:{cadence:1.88',
              'FOOT PLANT + LEG RESPONSE',
              'maxRootCorrection:.028',
              'Jump_Core',
              'Crouch_Walk_Core',
              'Dodge_R_Core',
              'Dodge_L_Core',
              'Hit_React_Core',
              'Knockback_Core',
              'Get_Up_Core',
              'Death_Core',
              'Faint_Core',
              'Interact_Core',
              'core-action-reaction-pack',
              'interact.commit',
              'Weapon ยังไม่เริ่ม'
          ]
          for token in preserved:
              if token not in h:
                  raise SystemExit('missing preserved regression token: '+token)
          required=[
              'CORE ANIMATION QA / TRANSITIONS',
              'id="coreAnimationQaBox"',
              'id="btnRunCoreAnimationQa"',
              'id="btnStampCoreTransitions"',
              'id="btnPreviewMovementChain"',
              'id="btnPreviewAirChain"',
              'id="btnPreviewRecoveryChain"',
              'CORE_ANIMATION_TRANSITIONS_V1_8_10',
              'CORE_ANIMATION_RECOVERY_V1_8_10',
              'core-transition-v1',
              'studioVersion:"1.8.10"',
              'stampCoreTransitionContractV1810',
              'runCoreAnimationQaV1810',
              'previewCoreTransitionSequenceV1810',
              'LOOP_SEAM',
              'AIR_CONTACT',
              'LAND_SUPPORT',
              'RECOVERY_SUPPORT',
              'TERMINAL_EXIT',
              'addTemplateClipV1810Base',
              'upgradeExistingCoreTransitionsV1810'
          ]
          for token in required:
              if token not in h:
                  raise SystemExit('missing V1.8.10 transition/QA gate: '+token)
          scripts=re.findall(r'<script type="module">(.*?)</script>',h,re.S)
          if not scripts:
              raise SystemExit('module script not found')
          Path('/tmp/studio-v1810.mjs').write_text(scripts[-1],encoding='utf-8')
          print('V1.8.10 core animation QA/transition regression gates passed')
          PY
          node --check /tmp/studio-v1810.mjs

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
