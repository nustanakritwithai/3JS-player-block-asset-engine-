name: Deploy Character Studio V1.8.2 to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install texture generator dependencies
        run: python -m pip install --disable-pip-version-check numpy pillow

      - name: Generate native 2K PBR starter textures
        run: python scripts/generate_textures.py --output assets/textures --resolution 2048

      - name: Verify texture quality gate
        run: python scripts/verify_textures.py assets/textures 2048

      - name: Build V1.8.1 Pages artifact
        run: python scripts/build_pages.py

      - name: Normalize V1.8.1 generated comment anchors
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('_site/index.html')
          h=p.read_text(encoding='utf-8')
          h=h.replace('// Generated by Character Prototype Studio V1.8.1\n','// Generated by Character Prototype Studio V1.8.1.1\n')
          p.write_text(h,encoding='utf-8')
          PY

      - name: Apply V1.8.2 Full-Body Twist Chain
        run: python scripts/patch_v1_8_2_output.py _site/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
