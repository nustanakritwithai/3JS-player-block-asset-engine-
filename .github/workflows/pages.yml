name: Deploy Character Studio V1.8.10.3 to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install texture generator dependencies
        run: python -m pip install --disable-pip-version-check numpy pillow

      - name: Generate native 2K PBR starter textures
        run: python scripts/generate_textures.py --output assets/textures --resolution 2048

      - name: Verify texture quality gate
        run: python scripts/verify_textures.py assets/textures 2048

      - name: Build V1.8.10.3 Pages artifact
        run: python scripts/build_pages.py

      - name: Verify V1.8.10.3 clip reference and regression gates
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          h=Path('_site/index.html').read_text(encoding='utf-8')
          ids=re.findall(r'id="([^"]+)"',h)
          if len(ids)!=len(set(ids)):
              raise SystemExit('duplicate DOM ids in V1.8.10.3')
          preserved=[
              'Twist_Isolation_V1_8_5_2',
              'walkVisualShiftCap:.016',
              'run:{cadence:1.48',
              'sprint:{cadence:1.88',
              'FOOT PLANT + LEG RESPONSE',
              'maxRootCorrection:.028',
              'Jump_Core',
              'Crouch_Walk_Core',
              'createDodgeCoreTemplate(side="R")',
              'Hit_React_Core',
              'Knockback_Core',
              'Interact_Core',
              'actionType:"throw"',
              'name:"ball.release"',
              'name:mode==="summon"?"monster.summon":"capture.throw"',
              'THREE_CORE_SOURCES=[',
              'makeFallbackOrbitControls',
              'makeFallbackTransformControls'
          ]
          for token in preserved:
              if token not in h:
                  raise SystemExit('missing preserved regression token: '+token)
          required=[
              'function renderContactAnalysis(){',
              'const clip=selectedAnimationClip();',
              'const state=contactStateAtTime(clip,animationState.time);',
              'checked=clip?.footPlant?.enabled!==false',
              'characterPrototypeStudio.v1.8.10.3'
          ]
          for token in required:
              if token not in h:
                  raise SystemExit('missing V1.8.10.3 clip-reference gate: '+token)
          if 'checked=clip.footPlant?.enabled!==false' in h:
              raise SystemExit('undefined clip regression still present in renderContactAnalysis')
          scripts=re.findall(r'<script type="module">(.*?)</script>',h,re.S)
          if not scripts:
              raise SystemExit('module script not found')
          Path('/tmp/studio-v18103.mjs').write_text(scripts[-1],encoding='utf-8')
          print('V1.8.10.3 clip reference/regression gates passed')
          PY
          node --check /tmp/studio-v18103.mjs

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
