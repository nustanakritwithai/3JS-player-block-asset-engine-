name: Deploy Character Studio V1.8.10.5 to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install texture generator dependencies
        run: python -m pip install --disable-pip-version-check numpy pillow

      - name: Generate native 2K PBR starter textures
        run: python scripts/generate_textures.py --output assets/textures --resolution 2048

      - name: Verify texture quality gate
        run: python scripts/verify_textures.py assets/textures 2048

      - name: Build V1.8.10.5 Pages artifact
        run: python scripts/build_pages.py

      - name: Verify Blue Explorer primary character and preserved runtime gates
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          h=Path('_site/index.html').read_text(encoding='utf-8')
          ids=re.findall(r'id="([^"]+)"',h)
          if len(ids)!=len(set(ids)):
              raise SystemExit('duplicate DOM ids in V1.8.10.5')
          required=[
              'Character Prototype Studio V1.8.10.5',
              'BLUE_EXPLORER_PRIMARY_ID="blue-explorer-primary-v1"',
              'function createBlueExplorer(THREE)',
              'function buildLegacyCharacter(preserve=true){',
              'function buildBlueExplorerPrimaryCharacter(preserve=true){',
              'function buildCharacter(preserve=true){return buildBlueExplorerPrimaryCharacter(preserve)}',
              'blueExplorerRegisterJoint("shoulderR",r.shoulder_left)',
              'blueExplorerRegisterJoint("wristR",r.wrist_left)',
              'blueExplorerRegisterJoint("ankleR",r.ankle_left)',
              'socket(joints.wristR,"hand.R",[0,-.34,.10])',
              'model.root.userData.engineRole="primary-character"',
              'throwStyle:"overhand-baseball"',
              'style:"overhead"',
              'name:"ball.release"',
              'name:mode==="summon"?"monster.summon":"capture.throw"',
              'Twist_Isolation_V1_8_5_2',
              'walkVisualShiftCap:.016',
              'run:{cadence:1.48',
              'sprint:{cadence:1.88',
              'FOOT PLANT + LEG RESPONSE',
              'maxRootCorrection:.028',
              'POCKET_STUDIO_CHARACTER_REQUEST',
              'POCKET_STUDIO_CHARACTER_PACKAGE',
              'pocket-character-runtime-v1',
              'three-group-scenegraph-v1',
              'pocket-character-render-profile-v1',
              'studio-starter-pbr-2k-v1',
          ]
          for token in required:
              if token not in h:
                  raise SystemExit('missing Blue Explorer/regression token: '+token)
          scripts=re.findall(r'<script type="module">(.*?)</script>',h,re.S)
          if not scripts:
              raise SystemExit('module script not found')
          Path('/tmp/studio-v18105.mjs').write_text(scripts[-1],encoding='utf-8')
          print('V1.8.10.5 Blue Explorer primary/regression gates passed')
          PY
          node --check /tmp/studio-v18105.mjs

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
