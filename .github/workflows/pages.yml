name: Deploy Character Studio V1.8.4 to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install texture generator dependencies
        run: python -m pip install --disable-pip-version-check numpy pillow

      - name: Generate native 2K PBR starter textures
        run: python scripts/generate_textures.py --output assets/textures --resolution 2048

      - name: Verify texture quality gate
        run: python scripts/verify_textures.py assets/textures 2048

      - name: Build Pages artifact
        run: python scripts/build_pages.py

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
