name: Deploy Character Studio V1.9.0 to Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, feat/v1.8.10-core-animation-qa-transitions-v2]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install texture generator dependencies
        run: python -m pip install --disable-pip-version-check numpy pillow

      - name: Generate native 2K PBR starter textures
        run: python scripts/generate_textures.py --output assets/textures --resolution 2048

      - name: Verify texture quality gate
        run: python scripts/verify_textures.py assets/textures 2048

      - name: Build V1.9.0 Pages artifact
        run: python scripts/build_pages.py

      - name: Verify V1.9.0 Pocket runtime export and regression gates
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re
          h=Path('_site/index.html').read_text(encoding='utf-8')
          ids=re.findall(r'id="([^"]+)"',h)
          if len(ids)!=len(set(ids)):
              raise SystemExit('duplicate DOM ids in V1.9.0')
          if h.count('id="btnTemplateAttack"')!=1 or h.count('id="btnTemplateWalk"')!=1:
              raise SystemExit('animation library controls missing/duplicated')
          if h.index('ANIMATION LIBRARY') > h.index('TIMELINE'):
              raise SystemExit('animation library moved below Timeline')
          preserved=[
              'Twist_Isolation_V1_8_5_2',
              'walkVisualShiftCap:.016',
              'run:{cadence:1.48',
              'sprint:{cadence:1.88',
              'FOOT PLANT + LEG RESPONSE',
              'maxRootCorrection:.028',
              'Jump_Core',
              'Crouch_Walk_Core',
              'createDodgeCoreTemplate(side="R")',
              '$("#btnTemplateDodgeR").onclick=()=>createDodgeCoreTemplate("R")',
              '$("#btnTemplateDodgeL").onclick=()=>createDodgeCoreTemplate("L")',
              'Hit_React_Core',
              'Knockback_Core',
              'Get_Up_Core',
              'Death_Core',
              'Faint_Core',
              'Interact_Core',
              'core-action-reaction-pack',
              'interact.commit',
              'CORE ANIMATION QA / TRANSITIONS',
              'CORE_ANIMATION_TRANSITIONS_V1_8_10',
              'runCoreAnimationQaV1810',
              'RECOVERY_SUPPORT',
              'LOOP_SEAM',
              'Weapon ยังไม่เริ่ม'
          ]
          for token in preserved:
              if token not in h:
                  raise SystemExit('missing preserved regression token: '+token)
          required=[
              'POCKET MONSTER RUNTIME EXPORT',
              'id="pocketRuntimeExportBox"',
              'id="pocketRuntimeCharacterId"',
              'id="pocketRuntimeCharacterName"',
              'id="btnPreviewPocketRuntime"',
              'id="btnExportPocketRuntime"',
              'POCKET_RUNTIME_SCHEMA_V1_9_0="pocket-character-runtime-v1"',
              'POCKET_RUNTIME_PROVIDER_V1_9_0="studio-character"',
              'POCKET_RUNTIME_FORBIDDEN_KEYS_V1_9_0',
              'sanitizePocketRuntimeValueV190',
              'pocketRuntimeGameplayLeaksV190',
              'validatePocketRuntimePackageV190',
              'buildPocketRuntimePackageV190',
              'exportPocketRuntimePackageV190',
              'contract:"presentation-only"',
              'gameplayPolicy:{included:false',
              'architecture:"THREE.Group"',
              'assetHandleContract:["root","rig","play","update","anchor","bounds","setAppearance","dispose"]',
              'rightHand:{joint:',
              'leftHand:{joint:',
              'attackOrigin:{joint:',
              'throwOrigin:{joint:',
              '.pocket-character.json',
              'crypto.subtle.digest("SHA-256"'
          ]
          for token in required:
              if token not in h:
                  raise SystemExit('missing V1.9.0 runtime export gate: '+token)
          schema=json.loads(Path('_site/schemas/pocket-character-runtime-v1.schema.json').read_text(encoding='utf-8'))
          if schema['properties']['schema']['const']!='pocket-character-runtime-v1':
              raise SystemExit('runtime package schema mismatch')
          if schema['properties']['target']['properties']['provider']['const']!='studio-character':
              raise SystemExit('runtime package provider schema mismatch')
          scripts=re.findall(r'<script type="module">(.*?)</script>',h,re.S)
          if not scripts:
              raise SystemExit('module script not found')
          Path('/tmp/studio-v190.mjs').write_text(scripts[-1],encoding='utf-8')
          print('V1.9.0 Pocket runtime export regression gates passed')
          PY
          node --check /tmp/studio-v190.mjs

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
