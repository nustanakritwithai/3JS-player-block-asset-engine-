name: Deploy Character Studio V1.8.10.7 to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install texture generator dependencies
        run: python -m pip install --disable-pip-version-check numpy pillow

      - name: Generate native 2K PBR starter textures
        run: python scripts/generate_textures.py --output assets/textures --resolution 2048

      - name: Verify texture quality gate
        run: python scripts/verify_textures.py assets/textures 2048

      - name: Build V1.8.10.7 Pages artifact
        run: python scripts/build_pages.py

      - name: Verify Tripo primary, fallback and shared solver runtime
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, hashlib, json, struct
          h=Path('_site/index.html').read_text(encoding='utf-8')
          source=Path('assets/imports/tripo_5889e73e/tripo_5889e73e.glb')
          raw=source.read_bytes()
          if raw[:4]!=b'glTF' or struct.unpack_from('<I',raw,4)[0]!=2:
              raise SystemExit('Tripo primary source is not glTF 2.0 binary')
          descriptor_path=Path('_site/assets/runtime/tripo_5889e73e/rigid-model.json')
          if not descriptor_path.is_file():
              raise SystemExit('Tripo rigid descriptor missing')
          descriptor=json.loads(descriptor_path.read_text(encoding='utf-8'))
          if descriptor.get('schema')!='studio-rigid-glb-v1' or descriptor.get('id')!='tripo-5889e73e-rigid-v1':
              raise SystemExit('Tripo rigid descriptor contract mismatch')
          stats=descriptor['stats']
          if stats['sourceVertices']!=34566 or stats['sourceTriangles']!=46897 or stats['rigidTriangles']!=46897:
              raise SystemExit('Tripo source/partition stats mismatch: '+repr(stats))
          required_regions=['pelvis','chest','head','upperArmL','lowerArmL','handL','upperArmR','lowerArmR','handR','thighL','shinL','footL','thighR','shinR','footR']
          if any(stats['regions'].get(name,0)<=0 for name in required_regions):
              raise SystemExit('Tripo primary has empty required rigid region')
          solver=Path('_site/assets/runtime/studio-solver-runtime-v1.mjs')
          if not solver.is_file():
              raise SystemExit('canonical solver runtime module missing')
          solver_sha=hashlib.sha256(solver.read_bytes()).hexdigest()
          match=re.search(r'POCKET_STUDIO_SOLVER_RUNTIME_SHA256="([0-9a-f]{64})"',h)
          if not match or match.group(1)!=solver_sha:
              raise SystemExit('solver runtime package SHA does not match shipped module')
          ids=re.findall(r'id="([^"]+)"',h)
          if len(ids)!=len(set(ids)):
              raise SystemExit('duplicate DOM ids in V1.8.10.7')
          required=[
              'Character Prototype Studio V1.8.10.7',
              'TRIPO_PRIMARY_ID="tripo-5889e73e-rigid-v1"',
              'TRIPO_PRIMARY_SOURCE="assets/imports/tripo_5889e73e/tripo_5889e73e.glb"',
              'function buildTripoPrimaryCharacter(preserve=true){',
              'function buildCharacter(preserve=true){return buildTripoPrimaryCharacter(preserve)}',
              'sourceCharacter:"tripo-5889e73e-rigid-v1"',
              'BLUE_EXPLORER_PRIMARY_ID="blue-explorer-primary-v1"',
              'return buildBlueExplorerPrimaryCharacter(preserve)',
              'function createBlueExplorer(THREE)',
              'socket(joints.wristR,"hand.R",[0,-.34,.10])',
              'socket(joints.ankleR,"foot.R",[0,-.40,.45])',
              'throwStyle:"overhand-baseball"',
              'name:"ball.release"',
              'name:mode==="summon"?"monster.summon":"capture.throw"',
              'studio-solver-runtime-v1',
              'same-standalone-runtime-source',
              'assets/runtime/studio-solver-runtime-v1.mjs',
              'solverRuntime:pocketStudioSolverRuntimeContract()',
              '"sample-blend","pelvis-weight","upper-body-weight","locomotion-dynamics","attack-weight"',
              '"body-dynamics","impact","momentum","equipment","foot-plant-leg-response"',
              'Twist_Isolation_V1_8_5_2',
              'walkVisualShiftCap:.016',
              'FOOT PLANT + LEG RESPONSE',
              'POCKET_STUDIO_CHARACTER_REQUEST',
              'pocket-character-runtime-v1',
              'three-group-scenegraph-v1',
              'studio-starter-pbr-2k-v1',
          ]
          for token in required:
              if token not in h:
                  raise SystemExit('missing V1.8.10.7 token: '+token)
          solver_source=solver.read_text(encoding='utf-8')
          solver_required=[
              'class CharacterAnimationRuntime',
              'applyRuntimePelvisSolver',
              'applyRuntimeUpperBodySolver',
              'applyRuntimeLocomotionDynamics',
              'applyRuntimeAttackWeight',
              'applyRuntimeBodyDynamics',
              'applyRuntimeImpactSolver',
              'applyRuntimeMomentumSolver',
              'applyRuntimeEquipmentResponse',
              'applyRuntimeFootPlantLegResponse',
          ]
          for token in solver_required:
              if token not in solver_source:
                  raise SystemExit('missing canonical solver function: '+token)
          scripts=re.findall(r'<script type="module">(.*?)</script>',h,re.S)
          if not scripts:
              raise SystemExit('module script not found')
          Path('/tmp/studio-v18107.mjs').write_text(scripts[-1],encoding='utf-8')
          print('V1.8.10.7 Tripo primary gate passed',stats,'solver',solver_sha)
          PY
          node --check /tmp/studio-v18107.mjs
          node --check _site/assets/runtime/studio-solver-runtime-v1.mjs

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
